services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-h3_videoops}
      POSTGRES_USER: ${POSTGRES_USER:-h3_videoops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h3_videoops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h3_videoops} -d ${POSTGRES_DB:-h3_videoops}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
