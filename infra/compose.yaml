services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-h3_videoops}
      POSTGRES_USER: ${POSTGRES_USER:-h3_videoops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h3_videoops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h3_videoops} -d ${POSTGRES_DB:-h3_videoops}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The browser editor route. Denies queue mutation so every generation has to
  # arrive through POST /v1/runs; see caddy/Caddyfile and gpu-executor
  # README section 5.
  comfy-gateway:
    profiles: [gateway]
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "8190"
      COMFY_UPSTREAM: ${COMFY_UPSTREAM:-host.docker.internal:8188}
      STUDIO_ORIGIN: ${VIDEOOPS_STUDIO_ORIGIN:-http://127.0.0.1:5173}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8190}:8190"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8190"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    depends_on:
      - tempo

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  grafana-data:
